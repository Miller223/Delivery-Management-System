version: "3.8"

services:
  delivery-mongo:
    image: mongo:latest
    container_name: delivery-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  delivery-redis:
    image: redis:latest
    container_name: delivery-redis
    ports:
      - "6379:6379"

  delivery-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: delivery-keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8080 && exit 0 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=9090
      - KC_HOSTNAME_STRICT=false
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak-themes/delivery-theme:/opt/keycloak/themes/delivery-theme
      - keycloak_data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm

  delivery-backend:
    build: .
    container_name: delivery-backend
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_BASE_URL=http://delivery-keycloak:8080
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_SECRET}
      # THIS IS THE FIX: Fetch keys from the internal Docker network directly
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://delivery-keycloak:8080/realms/delivery-realm/protocol/openid-connect/certs
    depends_on:
      delivery-keycloak:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data:
  keycloak_data: